# /etc/nginx/sites-available/curefoods-ess
# Proxies to the Node app on 127.0.0.1:3100.
#
# NOW (IP only, pilot):   listen on a spare port, e.g. 8080 -> http://103.172.150.31:8080
# LATER (domain):         set server_name, run certbot, and set HTTPS=true in .env
server {
    listen 8080;
    server_name _;            # later: ess.curefoods.in

    client_max_body_size 16m;  # 5 attachments x 2 MB (base64)
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
